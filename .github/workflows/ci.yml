name: CI (C++)

on:
  push:
    branches: [needspeed, main, master, dev]
  pull_request:
    branches: [needspeed, main, master, dev]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-tidy

      - name: Install dependencies
        run: |
          # NOTE: libtd-dev / libblake3-dev do not exist in Ubuntu repos.
          # TDLib builds via CMake FetchContent (needs gperf + zlib);
          # BLAKE3 falls back to FetchContent when the system lib is absent.
          sudo apt-get install -y -qq \
            cmake pkg-config gperf zlib1g-dev libssl-dev libzstd-dev \
            libboost-dev libfuse3-dev

      - name: Run clang-tidy
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DTV_BUILD_TESTS=ON -DTV_BUILD_FUSE=ON
          clang-tidy src/*.cpp src/**/*.cpp -- -I src

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [g++-14, clang++-18]
        standard: [23]

    steps:
      - uses: actions/checkout@v4

      - name: Install compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            g++-14 clang++-18 cmake pkg-config gperf zlib1g-dev \
            libssl-dev libzstd-dev \
            libboost-dev libfuse3-dev libncurses-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DTV_BUILD_TESTS=ON \
            -DTV_BUILD_FUSE=ON \
            -DTV_BUILD_TUI=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify binary
        run: ./build/src/televault --version

  # Build without optional features
  build-minimal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            g++-14 cmake pkg-config gperf zlib1g-dev libssl-dev libzstd-dev libboost-dev

      - name: Configure (no optional features)
        run: |
          cmake -B build-minimal \
            -DCMAKE_BUILD_TYPE=Release \
            -DTV_BUILD_TESTS=ON \
            -DTV_BUILD_FUSE=OFF \
            -DTV_BUILD_WEBDAV=OFF \
            -DTV_BUILD_TUI=OFF

      - name: Build minimal
        run: cmake --build build-minimal -j$(nproc)

      - name: Test minimal
        run: ctest --test-dir build-minimal --output-on-failure
